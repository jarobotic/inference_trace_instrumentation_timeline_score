[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jarobotic-dataplatform_jd097"
version = "0.1.0"
description = "解析时间标记，排列数据平台工程师·推理链路的追踪埋点的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jarobotic" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jarobotic.github.io"
Repository = "https://github.com/jarobotic/dataplatform_jd097"
Issues = "https://github.com/jarobotic/dataplatform_jd097/issues"

[project.scripts]
dataplatform_jd097 = "dataplatform_jd097:main"

[tool.setuptools]
py-modules = ["dataplatform_jd097"]
